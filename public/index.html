<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fa">
  <meta name="color-scheme" content="dark">
  <title>Africa Sportfishing</title>
  <meta name="description" content="Log and share big game catches across West Africa, home of the JHMMC club's points and tournaments.">
  <!--og-->
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Installed on an iPhone: full screen, with its own name under the icon. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sportfishing">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Oswald:wght@500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // The theme, applied before the page draws so it doesn't flash: the one
    // chosen on this phone, else light. Auto follows the phone's own setting.
    (function () {
      var chosen = null;
      try { chosen = localStorage.getItem('look'); } catch (e) {}
      var dark = chosen === 'dark' || (chosen === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (!dark) {
        document.documentElement.dataset.theme = 'light';
        document.querySelector('meta[name=color-scheme]').content = 'only light';
      }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Africa Sportfishing home"><img class="mark" src="/logo-mark.png" alt="" width="256" height="256"><span>Africa Sportfishing</span></a>
    <a href="#/leaderboard" class="club-chip" aria-label="JHMMC member" id="club-chip" hidden><img src="/jhmmc-logo.png" alt="" width="345" height="294"><span>JHMMC</span></a>
    <nav id="nav"></nav>
    <!-- The fishing chart, one tap from anywhere. -->
    <a href="#/chart" class="chart-link" aria-label="Fishing chart" title="Fishing chart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg></a>
  </header>
  <main id="view" aria-live="polite"></main>
  <div id="toast" role="status" hidden></div>
