# Builds the Android app (Google Play) as a signed .aab, ready to upload in the Play Console.
# Runs by hand: Actions → Android app → Run workflow. The .aab is under the run's Artifacts.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the upload keystore (signing.keystore), as base64
#   ANDROID_KEYSTORE_PASSWORD its password
#   ANDROID_KEY_ALIAS         the key's alias
#   ANDROID_KEY_PASSWORD      the key's password
name: Android app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor and copy its plugins into the Android project
        run: |
          npm ci
          npx cap sync android
      # google-services.json (Firebase, for notifications) is in the repository: it holds no
      # secret, and ships inside every copy of the app anyway.
      - name: Add the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::Add the ANDROID_KEYSTORE_BASE64 secret (the upload keystore as base64)."; exit 1; fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: Build the signed app bundle
        working-directory: android-app/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          # Signed with the upload key the Play Console expects (SHA-256 4E:04:0F:8C…).
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -i "SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: africa-sportfishing-aab
          path: android-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
